# buckboost24 — inverting buck-boost, sixth-topology model
# (TOPOLOGY_CAMPAIGN_PLAN P1, Tier 1).  12 V -> ~-12.1 V / 1 A at
# 200 kHz, CCM, peak CMC on i(L1) (state-based H sense) + light slope
# compensation.
#
# Topology: S1 vin->sw; L1 sw->gnd; D1 vout(anode)->sw(cathode) --
# conducts during OFF pulling sw to vout-vf (negative), blocked during
# ON (sw=+VIN).  Output node is NEGATIVE.
#
# Closed-form design table (recheck caught the draft divider error:
# 12/2.5 = 4.8 -> R18 = 26.1k, giving |VOUT| = 12.08 V):
#   D = (12.08+0.5)/(12+12.08+0.5) = 0.5117   IL_avg = 2.048 A
#   dIL = 12*D*T/L = 0.930 A (L = 33u)         IL_min = 1.58 A (CCM)
#   vsense_pk = 0.25 V (k = 0.1)
#   slope comp: sensed off-slew m2 = 0.1*12.5/33u = 37.9 kV/s, rule
#     Se >= m2/2 -> Se = I3/C16 = 250n/10p = 25 kV/s (alpha = 0.974)
#   dVOUT: ESR lo 18.6 mV / +C hi 19.9 mV
#   RHP zero (1-D)^2 R/(D L) = 27 kHz -> fc target 1.5 kHz, PM > 50
# Control ported from boost24 (slope block verbatim, I3 resized) on
# the flyback24 control skeleton.
meta:
  model: buckboost24
  fidelity: SIMPLIFIED

devices:
  # ---------------- power stage
  - {kind: V, name: VIN, n1: vin, n2: "0", value: {dc: 12}}
  - {kind: SW, name: S1, d1: vin, d2: sw, c1: u2o, c2: "0",
     ron: 1m, roff: 10Meg, threshold: 2, hystwd: 100m, ic: OPEN}
  - {kind: C, name: CSW, n1: sw, n2: "0", c: 100p, ic_v: 0}
  - {kind: L, name: L1, n1: sw, n2: "0", l: 33u, ic_i: 0}
  - {kind: D, name: D1, a: vout, k: sw, vf: 500m, ron: 10m, roff: 1G}
  - {kind: R, name: RESR, n1: vout, n2: co, r: 20m}
  - {kind: C, name: C6, n1: co, n2: "0", c: 220u, ic_v: -12}
  - {kind: R, name: R1, n1: vout, n2: "0", r: 12}

  # ---------------- current sense: peak CMC on i(L1) (state-based)
  - {kind: H, name: H1, n1: vsense, n2: "0", sense_i: L1, k: 100m}
  - {kind: R, name: R16, n1: vsense, n2: "0", r: 1}

  # ---------------- feedback divider + loop injection
  # (100k+26.1k)/26.1k = 4.83 -> |VOUT| = 12.08 V
  - {kind: V, name: V16, n1: vout, n2: fbt, value: {dc: 0}}   # AC injected here
  - {kind: R, name: R17, n1: fbt, n2: fb, r: 100k}
  - {kind: R, name: R18, n1: fb, n2: "0", r: 26.1k}

  # ---------------- error amplifier.  INVERTING-FEEDBACK POLARITY
  # (bring-up round 1 lesson: a positive VREF against the negative
  # divider voltage rails the EA to its clamp and pumps |VOUT| to the
  # peak-current limit -- VOUT measured -20.3 V).  Fix: reference
  # against -VREF and swap the G inputs, i.e. sense |VOUT|:
  #   |VOUT| up -> fb more negative -> i = gm*(fb-vref) < 0 -> ea down.
  # (flyback EA values; EA zero ~7 Hz below the 1.5 kHz fc target --
  # iterate if the acceptance window is missed)
  - {kind: V, name: VREF, n1: vref1, n2: "0", value: {dc: -2.5}}
  - {kind: G, name: G1, n1: "0", n2: ea, na: fb, nb: vref1, gm: 10u}
  - {kind: R, name: R19, n1: eaz, n2: ea, r: 220k}
  - {kind: C, name: C12, n1: eaz, n2: "0", c: 100n, ic_v: 0.35}
  - {kind: C, name: C1, n1: ea, n2: "0", c: 470p, ic_v: 0.35}
  # clamp EA to a sane command range (covers vsense_pk 0.25 V + ramp)
  - {kind: V, name: VCLL, n1: cllo, n2: "0", value: {dc: 0}}
  - {kind: V, name: VCLH, n1: clhi, n2: "0", value: {dc: 0.6}}
  - {kind: D, name: DCLL, a: cllo, k: ea, vf: 1m, ron: 1m, roff: 1G}
  - {kind: D, name: DCLH, a: ea, k: clhi, vf: 1m, ron: 1m, roff: 1G}

  # ---------------- slope compensation: v_cmd = EA - v(C16)
  # boost24 block verbatim with I3 sized for THIS model's sensed
  # off-slew (m2 = 0.1*12.5/33u = 37.9 kV/s; Se = 250n/10p = 25 kV/s
  # >= m2/2 with margin, alpha = (m1+Se)/(m2+Se) = 0.974 < 1)
  - {kind: I, name: I3, n1: "0", n2: sc4, value: {dc: 250n}}
  - {kind: C, name: C16, n1: sc4, n2: "0", c: 10p, ic_v: 0}
  - {kind: SW, name: S5, d1: sc4, d2: "0", c1: s5c, c2: "0",
     ron: 1m, roff: 1T, threshold: 2, hystwd: 100m, ic: CLOSE}
  - {kind: E, name: SLOPE_OS1, n1: slp1, n2: "0", na: ea, nb: sc4, k: 1}
  - {kind: E, name: SLOPE_OS, n1: cmpn, n2: "0", na: slp1, nb: "0", k: 1}

  # ---------------- PWM logic (clocked SR + max-duty clamp)
  - {kind: V, name: V3, n1: clk, n2: "0",
     value: {pulse: {v1: 0, v2: 5, period: 5u, width: 100n, rise: 10n, fall: 10n}}}
  - {kind: V, name: V4, n1: maxd, n2: "0",
     value: {pulse: {v1: 0, v2: 5, period: 5u, width: 100n, rise: 10n, fall: 10n, delay: 4.7u}}}
  - {kind: CMP, name: PK_CMP, out: cmpout, inp: cmpn, inn: vsense,
     vol: 0, voh: 5, rout: 10, hystwd: 1p, delay: 1n, ic: 0}
  - {kind: GATE, name: U7, out: resetb, inputs: [cmpout], fn: INV,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.15, hystwd: 0.1, delay: 0}
  - {kind: GATE, name: U3, out: rstf, inputs: [resetb, maxd], fn: OR,
     vol: 0, voh: 5, rout: 10, rin: 10Meg, th: 2.5, hystwd: 1, delay: 2p}
  - {kind: SRFF, name: U1, q: pwm, nq: pwmn, s: clk, r: rstf,
     vol: 0, voh: 5, rout: 10, rin: 10Meg, th: 2.5, hystwd: 1, delay: 0, ic: 0}
  - {kind: GATE, name: U2, out: u2o, inputs: [pwm], fn: BUF,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.5, hystwd: 1, delay: 2p}
  # slope-ramp reset while the switch is off (boost24 verbatim)
  - {kind: GATE, name: U6, out: u6o, inputs: [u2o], fn: BUF,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.5, hystwd: 1, delay: 1.5n}
  - {kind: GATE, name: U20, out: s5c, inputs: [u6o], fn: INV,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.5, hystwd: 1, delay: 0}

  # ---------------- POP trigger (clock rising through 2.5 V)
  - {kind: TRIG, name: X1, node: clk, vref: 2.5, edge: rising}

probes:
  VOUT: v(vout)
  IL1: i(L1)
  VSW: v(sw)
  EA: v(ea)
  PWM: v(pwm)
  IIN: i(VIN)

analyses:
  # 500 ns search grid (boost24 precedent: 5 us period, hidden-pair
  # hunt resolves the 10 ns clock edges)
  solver: {chunk: 500n}
  transient: {tstop: 3m, dt: 20n}
  pop:
    pre_cycles: 100
    max_iter: 100
    period_guess: 5u
    max_period_factor: 8
  pac:
    fstart: 10
    fstop: 50k
    per_decade: 10
    inject_src: V16
    probe_a: vout
    probe_b: fbt
