# cuk24 — coupled-inductor Cuk, seventh-topology model
# (TOPOLOGY_CAMPAIGN_PLAN P1, Tier 1).  12 V -> ~-15 V / 1 A at
# 200 kHz.
#
# TOPOLOGY (bring-up round 1 corrected the draft three ways -- the
# four-phase current constraints pin it: D must carry i1+i2 during
# OFF, C1 charges to +(VIN+|VOUT|), the diode blocks while b<0):
#   L1: vin->na (i1 enters n1)      S1: na->gnd
#   C1: na->nb  (v_C1 = +27.5 V)   D1: nb->gnd (anode nb!)
#   L2: vout->nb (i2 enters n1=vout side)
# In this canonical orientation v_L1 = v_L2 IN PHASE (ON: +vin both,
# OFF: -|vout| both) -- the ripple-transfer derivation then gives
#   x = v1*(L2-M)/(L1*L2-M^2)  ->  zero INPUT ripple at M = L2
# with ADDITIVE coupling (both i's enter their n1 dots, k > 0).
# Values L1=47u, L2=33u, M=32.5u -> k = +0.8248: R_in = 0.0475
# (input ripple /21), cond_L ~ 10 (T4 safe zone).
# CURRENT SENSE: switch current = i(L1)+i(L2) during ON and diode
# current = i(L1)+i(L2) during OFF -- the SUM is CONTINUOUS (sepic
# HANDOFF 16.2 lesson, same family): series H chain, both +k.
# Sensed slopes ~91 kV/s up / ~107 kV/s down -> alpha = 0.85 stable
# bare; the ramp is margin only.
# INVERTING FEEDBACK (buck-boost round-1 lesson): VREF = -2.5 V with
# the G inputs swapped = sensing |VOUT| against a positive reference.
# Closed-form: D = 0.5636, i1_avg = 1.29 A, i2_avg = IOUT = 1 A,
# di2 ~ 0.99 A, sum-current pk ~ 2.8 A -> EA trip ~ 0.77 V (VCLH 0.9).
# Damping (bring-up round 2, a Tier-1 physics finding): lossless
# coupling RESHAPES but does NOT DAMP the L1/L2/C1 exchange resonance
# -- the orbit converges N=1 but max|lam| = 1.0093 as a conjugate pair
# at 13.0 kHz (sepic HANDOFF 16.1 negative-damping mechanism, moved
# from ~5 kHz uncoupled to 13 kHz coupled).  RD/CD across C1 (sepic
# values): at 13 kHz X_CD = 0.56 ohm << RD = 2 ohm -> resistive sink;
# CD blocks the 27 V DC; dissipation ~0.1 W (0.7% of Pout).
meta:
  model: cuk24
  fidelity: SIMPLIFIED

devices:
  # ---------------- power stage (canonical Cuk, orientation above)
  - {kind: V, name: VIN, n1: vin, n2: "0", value: {dc: 12}}
  - {kind: L, name: L1, n1: vin, n2: na, l: 47u, ic_i: 0}
  - {kind: SW, name: S1, d1: na, d2: "0", c1: u2o, c2: "0",
     ron: 1m, roff: 10Meg, threshold: 2, hystwd: 100m, ic: OPEN}
  - {kind: C, name: CP, n1: na, n2: nb, c: 10u, ic_v: 27.5}
  # RC damper across the transfer cap (sepic HANDOFF 16.1 values;
  # CD PRE-CHARGED to the C1 DC level -- its tau = RD*CD = 44 ms
  # >> POP horizon, an uncharged CD never settles inside the search)
  - {kind: R, name: RD, n1: na, n2: nd, r: 2}
  - {kind: C, name: CD, n1: nd, n2: nb, c: 22u, ic_v: 27.5}
  - {kind: D, name: D1, a: nb, k: "0", vf: 500m, ron: 10m, roff: 1G}
  - {kind: L, name: L2, n1: vout, n2: nb, l: 33u, ic_i: 0}
  - {kind: R, name: RESR, n1: vout, n2: co, r: 20m}
  - {kind: C, name: C6, n1: co, n2: "0", c: 220u, ic_v: -15}
  - {kind: R, name: R1, n1: vout, n2: "0", r: 15}

  # ---------------- the coupled inductor (T4 device): ADDITIVE
  # orientation (both i's enter n1; k>0) per the header derivation
  - {kind: K, name: K1, l1: L1, l2: L2, k: 824.8m}

  # ---------------- current sense: series H chain for i(L1)+i(L2)
  # (continuous sum current -- switch current ON, diode current OFF)
  - {kind: H, name: H1, n1: vsh, n2: vsm, sense_i: L1, k: 250m}
  - {kind: H, name: H2, n1: vsm, n2: "0", sense_i: L2, k: 250m}
  - {kind: R, name: R16, n1: vsh, n2: "0", r: 1}

  # ---------------- feedback divider + loop injection
  # (100k+20k)/20k = 6 -> |VOUT| = 15 V
  - {kind: V, name: V16, n1: vout, n2: fbt, value: {dc: 0}}   # AC injected here
  - {kind: R, name: R17, n1: fbt, n2: fb, r: 100k}
  - {kind: R, name: R18, n1: fb, n2: "0", r: 20k}

  # ---------------- error amplifier: INVERTING polarity (VREF -2.5 V,
  # G inputs swapped) + flyback compensation values
  - {kind: V, name: VREF, n1: vref1, n2: "0", value: {dc: -2.5}}
  - {kind: G, name: G1, n1: "0", n2: ea, na: fb, nb: vref1, gm: 10u}
  - {kind: R, name: R19, n1: eaz, n2: ea, r: 220k}
  - {kind: C, name: C12, n1: eaz, n2: "0", c: 100n, ic_v: 0.35}
  - {kind: C, name: C1, n1: ea, n2: "0", c: 470p, ic_v: 0.35}
  # clamp covers the sum-current trip ~0.77 V (round-1 lesson: 0.6
  # railed the EA and the loop fell to the max-duty clamp at D=0.94)
  - {kind: V, name: VCLL, n1: cllo, n2: "0", value: {dc: 0}}
  - {kind: V, name: VCLH, n1: clhi, n2: "0", value: {dc: 0.9}}
  - {kind: D, name: DCLL, a: cllo, k: ea, vf: 1m, ron: 1m, roff: 1G}
  - {kind: D, name: DCLH, a: ea, k: clhi, vf: 1m, ron: 1m, roff: 1G}

  # ---------------- slope compensation: v_cmd = EA - v(C16)
  # (buck-boost block verbatim; margin only -- alpha = 0.85 bare)
  - {kind: I, name: I3, n1: "0", n2: sc4, value: {dc: 250n}}
  - {kind: C, name: C16, n1: sc4, n2: "0", c: 10p, ic_v: 0}
  - {kind: SW, name: S5, d1: sc4, d2: "0", c1: s5c, c2: "0",
     ron: 1m, roff: 1T, threshold: 2, hystwd: 100m, ic: CLOSE}
  - {kind: E, name: SLOPE_OS1, n1: slp1, n2: "0", na: ea, nb: sc4, k: 1}
  - {kind: E, name: SLOPE_OS, n1: cmpn, n2: "0", na: slp1, nb: "0", k: 1}

  # ---------------- PWM logic (clocked SR + max-duty clamp)
  - {kind: V, name: V3, n1: clk, n2: "0",
     value: {pulse: {v1: 0, v2: 5, period: 5u, width: 100n, rise: 10n, fall: 10n}}}
  - {kind: V, name: V4, n1: maxd, n2: "0",
     value: {pulse: {v1: 0, v2: 5, period: 5u, width: 100n, rise: 10n, fall: 10n, delay: 4.7u}}}
  - {kind: CMP, name: PK_CMP, out: cmpout, inp: cmpn, inn: vsh,
     vol: 0, voh: 5, rout: 10, hystwd: 1p, delay: 1n, ic: 0}
  - {kind: GATE, name: U7, out: resetb, inputs: [cmpout], fn: INV,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.15, hystwd: 0.1, delay: 0}
  - {kind: GATE, name: U3, out: rstf, inputs: [resetb, maxd], fn: OR,
     vol: 0, voh: 5, rout: 10, rin: 10Meg, th: 2.5, hystwd: 1, delay: 2p}
  - {kind: SRFF, name: U1, q: pwm, nq: pwmn, s: clk, r: rstf,
     vol: 0, voh: 5, rout: 10, rin: 10Meg, th: 2.5, hystwd: 1, delay: 0, ic: 0}
  - {kind: GATE, name: U2, out: u2o, inputs: [pwm], fn: BUF,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.5, hystwd: 1, delay: 2p}
  - {kind: GATE, name: U6, out: u6o, inputs: [u2o], fn: BUF,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.5, hystwd: 1, delay: 1.5n}
  - {kind: GATE, name: U20, out: s5c, inputs: [u6o], fn: INV,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.5, hystwd: 1, delay: 0}

  # ---------------- POP trigger (clock rising through 2.5 V)
  - {kind: TRIG, name: X1, node: clk, vref: 2.5, edge: rising}

probes:
  VOUT: v(vout)
  IL1: i(L1)
  IL2: i(L2)
  NA: v(na)
  NB: v(nb)
  EA: v(ea)
  PWM: v(pwm)
  IIN: i(VIN)

analyses:
  solver: {chunk: 500n}
  transient: {tstop: 3m, dt: 20n}
  pop:
    pre_cycles: 100
    max_iter: 100
    period_guess: 5u
    max_period_factor: 8
  pac:
    fstart: 10
    fstop: 50k
    per_decade: 10
    inject_src: V16
    probe_a: vout
    probe_b: fbt
