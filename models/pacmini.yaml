# pacmini — 3-state clocked test circuit for CLI-level PAC regressions.
# Mirrors tests/test_pac_math.py::pacmini(): comparator event flips an
# analog switch in the same event (df != 0), two same-delay BUFs fire
# together (shared timing slot), SW2's delayed close crosses D1's knee at
# h == 0 (zero-duration DELAY->D pair). Injection source VINJ sits between
# probe nodes A (clki) and B (clk).
meta:
  model: pacmini

devices:
  - {kind: V, name: V1, n1: clki, n2: "0",
     value: {pulse: {v1: 0, v2: 5, period: 1u, width: 0.6u, rise: 5n, fall: 5n}}}
  - {kind: V, name: VINJ, n1: clki, n2: clk, value: {dc: 0}}
  - {kind: R, name: R1, n1: clk, n2: vc, r: 1k}
  - {kind: C, name: C1, n1: vc, n2: "0", c: 100p, ic_v: 0.5}
  - {kind: V, name: VREF, n1: vr, n2: "0", value: {dc: 2.5}}
  - {kind: V, name: VP, n1: vp, n2: "0", value: {dc: 5}}
  # threshold node: bias divider + weak switched feed from the injection
  # node -> monitor's direct input channel is topology dependent
  - {kind: R, name: R8, n1: vth, n2: "0", r: 10k}
  - {kind: R, name: R10, n1: vr, n2: vth, r: 10k}
  - {kind: R, name: R7, n1: clk, n2: vb, r: 100k}
  - {kind: SW, name: SW3, d1: vb, d2: vth, c1: u3o, c2: "0",
     ron: 100, roff: 10Meg, threshold: 2, hystwd: 100m, ic: OPEN}
  - {kind: CMP, name: U1, out: cmpo, inp: vc, inn: vth,
     vol: 0, voh: 5, rout: 10, hystwd: 1m, delay: 1p, ic: 0}
  # comparator flips an analog switch in the SAME event (df != 0)
  - {kind: SW, name: SW1, d1: v2, d2: vmid, c1: cmpo, c2: "0",
     ron: 100, roff: 10Meg, threshold: 2, hystwd: 100m, ic: OPEN}
  - {kind: R, name: RL, n1: vmid, n2: "0", r: 100}
  - {kind: C, name: C2, n1: v2, n2: "0", c: 1n, ic_v: 4}
  - {kind: R, name: R2, n1: vp, n2: v2, r: 100}
  # two gates with the SAME delay from one cause: fire together by
  # construction (shared timing coefficient, accepted by PAC)
  - {kind: GATE, name: U2, out: u2o, inputs: [cmpo], fn: BUF,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.5, hystwd: 100m, delay: 50n}
  - {kind: GATE, name: U3, out: u3o, inputs: [cmpo], fn: BUF,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.5, hystwd: 100m, delay: 50n}
  - {kind: SW, name: SW2, d1: v4, d2: vmid4, c1: u2o, c2: "0",
     ron: 100, roff: 10Meg, threshold: 2, hystwd: 100m, ic: OPEN}
  - {kind: R, name: RL4, n1: vmid4, n2: "0", r: 100}
  # vmid4 is algebraic: when SW2 closes it jumps across D1's knee in one
  # step -> diode turns on at h == 0 after the DELAY event
  - {kind: D, name: D1, a: vmid4, k: "0", vf: 1m, ron: 10m, roff: 1G}
  - {kind: C, name: C4, n1: v4, n2: "0", c: 1n, ic_v: 4}
  - {kind: R, name: R6, n1: vp, n2: v4, r: 1k}
  - {kind: TRIG, name: X1, node: clk, vref: 2.5, edge: rising}

probes:
  VC: v(vc)
  V2N: v(v2)
  V4: v(v4)
  VMID: v(vmid)
  VMID4: v(vmid4)
  VTH: v(vth)
  A: v(clki)
  B: v(clk)

analyses:
  pop:
    pre_cycles: 150
    max_iter: 100
  pac:
    fstart: 1k
    fstop: 100k
    per_decade: 3
    inject_src: VINJ
    probe_a: VMID
    probe_b: B
