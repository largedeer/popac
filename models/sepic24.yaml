# sepic24 — peak-current-mode SEPIC (uncoupled inductors), fourth-topology
# model (CPP_MIGRATION_AND_TOPOLOGY_PLAN T3).  12 V -> ~24.5 V / 2 A at
# 200 kHz; same output point as boost24 for side-by-side RHP-zero
# comparison.  Peak CMC senses the SWITCH current (i(L1)+i(L2) during ON,
# zero during OFF) through a lossless 0 V ammeter in the switch leg —
# Sensed as the CONTINUOUS sum i(L1)+i(L2) (two H sources on one
# node): trip-equivalent to switch-current sensing, but state-based.
#
# IMPORTANT physics finding (documented, out/sepic24_*.log): the IDEAL
# uncoupled CCM SEPIC has an undamped internal resonance — the (u,vc)
# exchange mode, w^2 = [(1-D)^2/L1 + D^2/L2]/Cp ~ 23.7 krad/s here, split
# slightly UNSTABLE (+2.37e4 1/s) by the load coupling.  The mode is
# sum-preserving (i1+i2 const): invisible to the switch-current loop AND
# to the output voltage loop — neither can stabilize it.  DCM does not
# help either (the diode carries the SUM, which stays positive).  Fix =
# the documented SEPIC practice of damping the flying-cap branch:
# RD||CD network across CP (Ridley's "damping resistors"); with RD=2,
# CD=22u the exchange mode is dead (simulator-verified, fixed-cmd run:
# VC pinned at ~VIN, i1/i2 quiet).
#
# Control (SIMPLIFIED tier): transconductance EA re-compensated for this
# plant (R19 100k / C12 27n / C1 330p: EA zero ~59 Hz cancels the output
# pole, mid-band crossover ~460 Hz = RHP/6.4, EA pole ~4.8 kHz; boost24's
# stock EA is NOT stable on this plant).  Slope Se = I3/C16 = 250n/10p =
# 25 kV/s = the sensed sum off-slope k*(1/L1+1/L2)*(VOUT+vf) -- deadbeat
# subharmonic damping for D ~ 0.68.
#
# Steady-state topology relations (asserted in tests/test_sepic.py):
#   D = (VOUT+vf)/(VIN+VOUT+vf); flying cap mean V(Cp) = VIN (charge
#   balance); i(L2) avg = VOUT/R (exactly the output current); i(L1) avg =
#   D/(1-D) * VOUT/R.  Ripple: dIL1 = dIL2 = VIN*D*T/L (in phase, sum
#   ripple doubles through the switch).
#
# RHP zero is NOT hardcoded: tests compute it numerically from the actual
# parameters via the 4-state averaged model (i1,i2,vc,vo) and gate the
# measured PAC crossover at fc < f_RHP/3.
meta:
  model: sepic24
  fidelity: SIMPLIFIED

devices:
  # ---------------- power stage
  - {kind: V, name: VIN, n1: vin, n2: "0", value: {dc: 12}}
  - {kind: L, name: L1, n1: vin, n2: sw, l: 100u, ic_i: 4.25}
  - {kind: SW, name: S1, d1: sw, d2: "0", c1: u2o, c2: "0",
     ron: 1m, roff: 10Meg, threshold: 2, hystwd: 100m, ic: OPEN}
  - {kind: C, name: CP, n1: sw, n2: cs, c: 10u, ic_v: 12.3}     # flying cap
  # flying-cap damping network (see header): kills the undamped (u,vc)
  # exchange resonance of the ideal uncoupled CCM SEPIC.  CD blocks DC
  # (no steady loss); at the 3.8 kHz mode frequency CD is ~2 ohm and the
  # branch behaves like the 2 ohm resistor.  Precharged to VIN = its DC
  # value (RD*CD = 44 ms — far slower than any sim window).
  - {kind: R, name: RD, n1: sw, n2: cdm, r: 2.0}
  - {kind: C, name: CD, n1: cdm, n2: cs, c: 22u, ic_v: 12.3}
  # conditioning parasitic (declared): during a fast SW edge the cs node
  # sees only CP (L2 blocks, D reverse-biased) and sw only CP+CCS once S
  # releases -- CCS gives both nodes their edge path via the CP-CCS series
  # route.  NOTE no separate cap on sw: CSW-CP-CCS would form a pure-C
  # loop -> SINGULAR_TOPOLOGY (pencil reduction).
  # ic aligned to the OFF-topology steady state (sw = VCP + v(cs) ~ 37 V)
  - {kind: C, name: CCS, n1: cs, n2: "0", c: 100p, ic_v: 25}
  # L2 pins n1=gnd, n2=cs: the physical current (gnd -> cs, charging
  # during ON and delivering through D1 during OFF) is then POSITIVE in
  # device convention; its average equals the output current (~2 A)
  - {kind: L, name: L2, n1: "0", n2: cs, l: 100u, ic_i: 2.0}
  - {kind: D, name: D1, a: cs, k: vout, vf: 500m, ron: 10m, roff: 1G}
  - {kind: R, name: RESR, n1: vout, n2: co, r: 20m}
  - {kind: C, name: C6, n1: co, n2: "0", c: 220u, ic_v: 24.5}
  - {kind: R, name: R1, n1: vout, n2: "0", r: 12}

  # ---------------- current sense: CONTINUOUS sum current i(L1)+i(L2).
  # During ON the sum IS the switch current, so the trip instant is
  # identical to switch-leg sensing (what the first version used via a 0 V
  # ammeter); during OFF the SRFF is already reset so the comparator state
  # is irrelevant.  The continuous signal avoids the algebraic vsense jump
  # at every pwm edge, which made the comparator immediate-fire twice per
  # cycle and left a ~0.5% gap in PAC's folded-saltation bookkeeping
  # (out/sepic24_ztrack2b.log: an7 vs fd7 at mid3).
  # series chain (KVL sum; two ideal sources on ONE node would be
  # overconstrained): v(vsense) = k*i(L1) + k*i(L2)
  - {kind: H, name: H1A, n1: vsense, n2: vmid, sense_i: L1, k: 50m}
  - {kind: H, name: H1B, n1: vmid, n2: "0", sense_i: L2, k: 50m}
  - {kind: R, name: R16, n1: vsense, n2: "0", r: 1}

  # ---------------- feedback divider + loop injection (boost24 values)
  - {kind: V, name: V16, n1: vout, n2: fbt, value: {dc: 0}}   # AC injected here
  - {kind: R, name: R17, n1: fbt, n2: fb, r: 100k}
  - {kind: R, name: R18, n1: fb, n2: "0", r: 11.36k}

  # ---------------- error amplifier (transconductance, from boost24)
  - {kind: V, name: VREF, n1: vref1, n2: "0", value: {dc: 2.5}}
  - {kind: G, name: G1, n1: "0", n2: ea, na: vref1, nb: fb, gm: 10u}
  - {kind: R, name: R19, n1: eaz, n2: ea, r: 100k}
  - {kind: C, name: C12, n1: eaz, n2: "0", c: 27n, ic_v: 0.39}
  - {kind: C, name: C1, n1: ea, n2: "0", c: 330p, ic_v: 0.39}
  # clamp EA to a sane command range 0..0.5 V (i_sw_pk <= 10 A)
  - {kind: V, name: VCLL, n1: cllo, n2: "0", value: {dc: 0}}
  - {kind: V, name: VCLH, n1: clhi, n2: "0", value: {dc: 0.5}}
  - {kind: D, name: DCLL, a: cllo, k: ea, vf: 1m, ron: 1m, roff: 1G}
  - {kind: D, name: DCLH, a: ea, k: clhi, vf: 1m, ron: 1m, roff: 1G}

  # ---------------- slope compensation: v_cmd = EA - v(C16)
  # Se = I3/C16 = 250n/10p = 25 kV/s = the sensed sum off-slope
  # k*(1/L1+1/L2)*(VOUT+vf) -> deadbeat subharmonic damping at D~0.68
  - {kind: I, name: I3, n1: "0", n2: sc4, value: {dc: 250n}}
  - {kind: C, name: C16, n1: sc4, n2: "0", c: 10p, ic_v: 0}
  - {kind: SW, name: S5, d1: sc4, d2: "0", c1: s5c, c2: "0",
     ron: 1m, roff: 1T, threshold: 2, hystwd: 100m, ic: CLOSE}
  - {kind: E, name: SLOPE_OS1, n1: slp1, n2: "0", na: ea, nb: sc4, k: 1}
  - {kind: E, name: SLOPE_OS, n1: cmpn, n2: "0", na: slp1, nb: "0", k: 1}

  # ---------------- PWM logic (clocked SR + max-duty clamp)
  - {kind: V, name: V3, n1: clk, n2: "0",
     value: {pulse: {v1: 0, v2: 5, period: 5u, width: 100n, rise: 10n, fall: 10n}}}
  - {kind: V, name: V4, n1: maxd, n2: "0",
     value: {pulse: {v1: 0, v2: 5, period: 5u, width: 100n, rise: 10n, fall: 10n, delay: 4.6u}}}
  - {kind: CMP, name: PK_CMP, out: cmpout, inp: cmpn, inn: vsense,
     vol: 0, voh: 5, rout: 10, hystwd: 1p, delay: 1n, ic: 0}
  - {kind: GATE, name: U7, out: resetb, inputs: [cmpout], fn: INV,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.15, hystwd: 0.1, delay: 0}
  - {kind: GATE, name: U3, out: rstf, inputs: [resetb, maxd], fn: OR,
     vol: 0, voh: 5, rout: 10, rin: 10Meg, th: 2.5, hystwd: 1, delay: 2p}
  - {kind: SRFF, name: U1, q: pwm, nq: pwmn, s: clk, r: rstf,
     vol: 0, voh: 5, rout: 10, rin: 10Meg, th: 2.5, hystwd: 1, delay: 0, ic: 0}
  - {kind: GATE, name: U2, out: u2o, inputs: [pwm], fn: BUF,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.5, hystwd: 1, delay: 2p}
  # slope-ramp reset while the switch is off (boost24 U6/U20 pattern)
  - {kind: GATE, name: U6, out: u6o, inputs: [u2o], fn: BUF,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.5, hystwd: 1, delay: 1.5n}
  - {kind: GATE, name: U20, out: s5c, inputs: [u6o], fn: INV,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.5, hystwd: 1, delay: 0}

  # ---------------- POP trigger (clock rising through 2.5 V)
  - {kind: TRIG, name: X1, node: clk, vref: 2.5, edge: rising}

probes:
  VOUT: v(vout)
  IL1: i(L1)
  IL2: i(L2)
  VSW: v(sw)
  VCS: v(cs)
  EA: v(ea)
  PWM: v(pwm)
  IIN: i(VIN)

analyses:
  # 500 ns search grid: 5 us period, boost24 precedent (identical event
  # count vs 100 ns grid, 3.4x faster)
  solver: {chunk: 500n}
  transient: {tstop: 3m, dt: 20n}
  pop:
    pre_cycles: 150
    max_iter: 100
    period_guess: 5u
    max_period_factor: 8
  pac:
    fstart: 30
    fstop: 100k
    per_decade: 10
    inject_src: V16
    probe_a: vout
    probe_b: fbt
