# zeta24 — non-inverting Zeta, eighth-topology model (Tier 2 smoke,
# TOPOLOGY_CAMPAIGN_PLAN P1).  12 V -> ~5 V / 1 A at 200 kHz.
#
# TOPOLOGY (pinned by the four phase constraints -- volt-second and
# charge balance on both inductors, diode one-wayness in both phases;
# the draft-from-memory versions kept violating them, see plan Task 10):
#   S:  vin->na   (switch on the INPUT side -- the Zeta signature)
#   L1: na->gnd
#   C1: na->nb   (flying cap, DC value -(VOUT-vf) ~ -4.5 V, NEGATIVE)
#   D:  gnd->nb  (anode at ground)
#   L2: nb->vout
# Phase check: ON -- na=12, nb=12-vc=+16.5, D reverse; v_L1=+12,
# v_L2=+11.5 (both rise).  OFF -- na pulled down through C1, D clamps
# nb to -vf; v_L1=vc+0.5=-4.0, v_L2=-5.5 (both fall).  Switch current
# = i(L1)+i(L2) during ON (the family signature: sepic / Cuk / zeta),
# diode current = i2-i1 during OFF.
# Steady state: D = VOUT/(VIN+VOUT) = 0.294; i1 = D/(1-D)*IOUT =
# 0.417 A; i2 = IOUT = 1 A exactly; charge balance on C1 closes the
# i1 relation identically to the Cuk.
# Control: peak CMC on the CONTINUOUS sum i(L1)+i(L2) (series H
# chain -- the sepic HANDOFF 16.2 lesson, third application).  D<0.5
# -> Sf<Sn, stable bare; ramp is margin.  Output POSITIVE -> the
# boost24 feedback polarity (VREF +2.5, divider to ground), unlike
# the inverting buck-boost/cuk.
# Exchange-resonance damper RD/CD across C1 from the start (family
# practice: sepic HANDOFF 16.1, cuk round 2), CD precharged to the C1
# DC level (tau = 44 ms >> POP horizon).
meta:
  model: zeta24
  fidelity: SIMPLIFIED

devices:
  # ---------------- power stage
  - {kind: V, name: VIN, n1: vin, n2: "0", value: {dc: 12}}
  - {kind: SW, name: S1, d1: vin, d2: na, c1: u2o, c2: "0",
     ron: 1m, roff: 10Meg, threshold: 2, hystwd: 100m, ic: OPEN}
  - {kind: L, name: L1, n1: na, n2: "0", l: 47u, ic_i: 0}
  - {kind: C, name: CP, n1: na, n2: nb, c: 10u, ic_v: -4.5}
  # exchange-resonance damper (family practice), CD precharged
  - {kind: R, name: RD, n1: na, n2: nd, r: 2}
  - {kind: C, name: CD, n1: nd, n2: nb, c: 22u, ic_v: -4.5}
  - {kind: D, name: D1, a: "0", k: nb, vf: 500m, ron: 10m, roff: 1G}
  - {kind: L, name: L2, n1: nb, n2: vout, l: 47u, ic_i: 0}
  - {kind: R, name: RESR, n1: vout, n2: co, r: 20m}
  - {kind: C, name: C6, n1: co, n2: "0", c: 220u, ic_v: 5}
  - {kind: R, name: R1, n1: vout, n2: "0", r: 5}

  # ---------------- current sense: series H chain for i(L1)+i(L2)
  # (continuous sum = switch current ON / transfer-cap return OFF)
  - {kind: H, name: H1, n1: vsh, n2: vsm, sense_i: L1, k: 250m}
  - {kind: H, name: H2, n1: vsm, n2: "0", sense_i: L2, k: 250m}
  - {kind: R, name: R16, n1: vsh, n2: "0", r: 1}

  # ---------------- feedback divider + loop injection
  # POSITIVE output: (100k+100k)/100k = 2 -> VOUT = 5 V
  - {kind: V, name: V16, n1: vout, n2: fbt, value: {dc: 0}}   # AC injected here
  - {kind: R, name: R17, n1: fbt, n2: fb, r: 100k}
  - {kind: R, name: R18, n1: fb, n2: "0", r: 100k}

  # ---------------- error amplifier (boost24 polarity -- positive out)
  - {kind: V, name: VREF, n1: vref1, n2: "0", value: {dc: 2.5}}
  - {kind: G, name: G1, n1: "0", n2: ea, na: vref1, nb: fb, gm: 10u}
  - {kind: R, name: R19, n1: eaz, n2: ea, r: 220k}
  - {kind: C, name: C12, n1: eaz, n2: "0", c: 100n, ic_v: 0.35}
  - {kind: C, name: C1, n1: ea, n2: "0", c: 470p, ic_v: 0.35}
  # clamp covers the sum-current trip ~0.45 V with headroom
  - {kind: V, name: VCLL, n1: cllo, n2: "0", value: {dc: 0}}
  - {kind: V, name: VCLH, n1: clhi, n2: "0", value: {dc: 0.9}}
  - {kind: D, name: DCLL, a: cllo, k: ea, vf: 1m, ron: 1m, roff: 1G}
  - {kind: D, name: DCLH, a: ea, k: clhi, vf: 1m, ron: 1m, roff: 1G}

  # ---------------- slope compensation: v_cmd = EA - v(C16)
  # (buck-boost block verbatim; margin only -- D<0.5 is stable bare)
  - {kind: I, name: I3, n1: "0", n2: sc4, value: {dc: 250n}}
  - {kind: C, name: C16, n1: sc4, n2: "0", c: 10p, ic_v: 0}
  - {kind: SW, name: S5, d1: sc4, d2: "0", c1: s5c, c2: "0",
     ron: 1m, roff: 1T, threshold: 2, hystwd: 100m, ic: CLOSE}
  - {kind: E, name: SLOPE_OS1, n1: slp1, n2: "0", na: ea, nb: sc4, k: 1}
  - {kind: E, name: SLOPE_OS, n1: cmpn, n2: "0", na: slp1, nb: "0", k: 1}

  # ---------------- PWM logic (clocked SR + max-duty clamp)
  - {kind: V, name: V3, n1: clk, n2: "0",
     value: {pulse: {v1: 0, v2: 5, period: 5u, width: 100n, rise: 10n, fall: 10n}}}
  - {kind: V, name: V4, n1: maxd, n2: "0",
     value: {pulse: {v1: 0, v2: 5, period: 5u, width: 100n, rise: 10n, fall: 10n, delay: 4.7u}}}
  - {kind: CMP, name: PK_CMP, out: cmpout, inp: cmpn, inn: vsh,
     vol: 0, voh: 5, rout: 10, hystwd: 1p, delay: 1n, ic: 0}
  - {kind: GATE, name: U7, out: resetb, inputs: [cmpout], fn: INV,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.15, hystwd: 0.1, delay: 0}
  - {kind: GATE, name: U3, out: rstf, inputs: [resetb, maxd], fn: OR,
     vol: 0, voh: 5, rout: 10, rin: 10Meg, th: 2.5, hystwd: 1, delay: 2p}
  - {kind: SRFF, name: U1, q: pwm, nq: pwmn, s: clk, r: rstf,
     vol: 0, voh: 5, rout: 10, rin: 10Meg, th: 2.5, hystwd: 1, delay: 0, ic: 0}
  - {kind: GATE, name: U2, out: u2o, inputs: [pwm], fn: BUF,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.5, hystwd: 1, delay: 2p}
  - {kind: GATE, name: U6, out: u6o, inputs: [u2o], fn: BUF,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.5, hystwd: 1, delay: 1.5n}
  - {kind: GATE, name: U20, out: s5c, inputs: [u6o], fn: INV,
     vol: 0, voh: 5, rout: 41.67, rin: 10Meg, th: 2.5, hystwd: 1, delay: 0}

  # ---------------- POP trigger (clock rising through 2.5 V)
  - {kind: TRIG, name: X1, node: clk, vref: 2.5, edge: rising}

probes:
  VOUT: v(vout)
  IL1: i(L1)
  IL2: i(L2)
  NA: v(na)
  NB: v(nb)
  EA: v(ea)
  PWM: v(pwm)
  IIN: i(VIN)

analyses:
  solver: {chunk: 500n}
  transient: {tstop: 3m, dt: 20n}
  pop:
    pre_cycles: 100
    max_iter: 100
    period_guess: 5u
    max_period_factor: 8
  pac:
    fstart: 10
    fstop: 50k
    per_decade: 10
    inject_src: V16
    probe_a: vout
    probe_b: fbt
